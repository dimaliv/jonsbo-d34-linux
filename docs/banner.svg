<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="320" viewBox="0 0 1120 320" role="img" aria-labelledby="title desc">
  <title id="title">Jonsbo D34 · Linux</title>
  <desc id="desc">A lightweight USB status panel service. Fast USB updates, calmer CPU readings.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop stop-color="#101c30"/>
      <stop offset="1" stop-color="#101318"/>
    </linearGradient>
    <linearGradient id="accent">
      <stop stop-color="#6ee7b7"/>
      <stop offset="1" stop-color="#93c5fd"/>
    </linearGradient>
  </defs>
  <rect width="1120" height="320" rx="24" fill="url(#bg)"/>
  <rect x="48" y="49" width="40" height="4" rx="2" fill="url(#accent)"/>
  <g font-family="system-ui, sans-serif">
    <text x="48" y="98" fill="#6ee7b7" font-size="13" letter-spacing="3">LINUX · USB HID · ZERO DEPENDENCIES</text>
    <text x="44" y="170" fill="#f1f5f9" font-size="60" font-weight="700">Jonsbo D34</text>
    <text x="48" y="212" fill="#b0bdd1" font-size="20">Fast USB updates. Calmer CPU readings.</text>
    <text x="48" y="272" fill="#6f859f" font-size="14">Clock / CPU / Radeon / SteamOS</text>
    <rect x="722" y="56" width="346" height="208" rx="16" fill="#0b111c" stroke="#2a3b50"/>
    <circle cx="745" cy="82" r="4" fill="#6ee7b7"/>
    <text x="760" y="87" fill="#91a5bc" font-size="12" letter-spacing="1">DISPLAY SERVICE</text>
    <path d="M746 111H1044" stroke="#213144"/>
    <text x="746" y="148" fill="#91a5bc" font-size="14">USB packets</text>
    <text x="1044" y="152" text-anchor="end" fill="#6ee7b7" font-size="27" font-weight="600">200 ms</text>
    <text x="746" y="197" fill="#91a5bc" font-size="14">CPU sampling</text>
    <text x="1044" y="201" text-anchor="end" fill="#93c5fd" font-size="27" font-weight="600">1 s</text>
    <text x="746" y="239" fill="#617992" font-size="12">Independent intervals · Configurable</text>
  </g>
</svg>
